function platformBrand(c){return TOYOTA_LEXUS_IDS.includes(c.id)?(c.id==='is200'?'Lexus':'Toyota'):'Other'}
function upgradeStageDef(path,stage){let p=UPGRADE_PATHS[path];return p&&p.stages[stage]?p.stages[stage]:null}
function upgradeStageName(path,stage){let d=upgradeStageDef(path,stage);return d?d.name:'Stock'}
function upgradeStageId(path,stage){return path+':'+stage}
function totalUpgradeStageCount(c){return Object.values(c.upgradeStages||{}).reduce((s,v)=>s+(Number(v)||0),0)}
function buildSignature(c){return Object.entries(c.upgradeStages||{}).sort().map(([k,v])=>k+':'+v).join('|')}
function tuneSensitiveCount(c){let count=0;for(const [path,stage] of Object.entries(c.upgradeStages||{})){for(let i=1;i<=stage;i++){let d=upgradeStageDef(path,i);if(d&&d.tuneSensitive)count++;}}return count}
function normaliseBuild(c){if(!c)return;c.basePower=c.basePower||c.power||carById(c.id)?.power||100;c.baseWeight=c.baseWeight||c.weight||carById(c.id)?.weight||1200;c.baseGrip=c.baseGrip||c.grip||c.baseGrip||carById(c.id)?.baseGrip||.82;c.basePeak=c.basePeak||c.peak||carById(c.id)?.peak||5500;c.baseReliability=c.baseReliability||c.reliability||88;if(!c.upgradeStages)c.upgradeStages={intake:0,exhaust:0,tyres:0,diff:0,ecu:0,transmission:0,weight:0};for(const k of Object.keys(UPGRADE_PATHS)){if(c.upgradeStages[k]===undefined)c.upgradeStages[k]=0;}if(c.tuneFresh===undefined)c.tuneFresh=false;if(c.tuneVariance===undefined)c.tuneVariance=0;if(c.tuneSignature===undefined)c.tuneSignature='';if(c.dynoQuality===undefined)c.dynoQuality=0;if(!c.dynoCurve)c.dynoCurve=null;if(!c.buildTags)c.buildTags=[];if(!c.installed)c.installed=[];if(!c.mods)c.mods=[];}
function rollTuneVariance(c){let sens=tuneSensitiveCount(c);if(!sens){c.tuneVariance=0;return;}let unstable=0;for(const [path,stage] of Object.entries(c.upgradeStages||{})){for(let i=1;i<=stage;i++){let d=upgradeStageDef(path,i);if(d&&d.unstable)unstable++;}}

function offerCard(o){return `<div class="listing"><h3>${o.buyer}</h3><p>${o.message}</p><p>Offer: <b>${fmt(o.amount)}</b></p><p class="small muted">${o.kind||'classified'} offer / Day ${o.day}</p><div class="btns"><button class="btn" onclick="acceptCarOffer('${o.id}')">Accept</button><button class="btn secondary" onclick="counterCarOffer('${o.id}')">Counter +10%</button><button class="btn secondary" onclick="declineCarOffer('${o.id}')">Decline</button></div></div>`}
function listCarForSale(mode='fair'){normaliseState();if(!state.car)return;state.car.listedForSale=true;state.car.saleMode=mode;state.car.listedDay=state.day;log('Listed '+state.car.name+' in the classifieds: '+listingLabel(mode)+'.','money',[`Still drivable while listed`]);show('market')}

function instantSellCar(){normaliseState();if(!state.car)return;let v=estimateCarValue(state.car);let before=snapshot();let sold=state.car.name;state.money+=v.wholesaleValue;state.car=null;state.owned=[];state.marketOffers=[];state.pendingSale=null;logChange('Sold '+sold+' immediately to a wholesaler.',before,'money',[`Sale price ${fmt(v.wholesaleValue)}`]);state.screen='garage';render()}
function makeMarketOffer(kind='classified',bonus=1){normaliseState();let c=state.car;if(!c||!c.listedForSale)return null;let v=estimateCarValue(c);let mode=c.saleMode||'fair';let ask=v.privateValue*listingMultiplier(mode);let interest=mode==='quick'?.55:mode==='fair'?.32:mode==='optimistic'?.18:.08;interest+=Math.min(.18,(state.respect||0)*.004)+Math.min(.18,(c.sceneValue||0)*.025);if(Math.random()>interest*bonus)return null;let buyers=['Bloke from the pits','Local P-plater','Older racer','Facebook Marketplace buyer','Mate of a mate','Workshop regular','Cash buyer'];let ratio=mode==='quick'?rand(.88,1.02):mode==='fair'?rand(.9,1.08):mode==='optimistic'?rand(.82,1.02):rand(.7,.92);let amount=Math.round(Math.max(v.wholesaleValue*1.05,ask*ratio)/50)*50;let id='offer_'+Date.now()+'_'+Math.random().toString(16).slice(2);let message=kind==='pit'?`Saw the car run and wants to buy it while it has some hype.`:`Responded to your ${listingLabel(mode)} listing. Reliability, mods and recent runs affect the offer.`;let offer={id,day:state.day,buyer:choice(buyers),amount,kind,message,closed:false};state.marketOffers.push(offer);log('New buyer offer for '+c.name+': '+fmt(amount)+'.','money',[offer.buyer,kind]);return offer;}
function acceptCarOffer(id){let o=(state.marketOffers||[]).find(x=>x.id===id&&!x.closed);if(!o||!state.car)return;o.closed=true;if(hasEventSession()){state.pendingSale={amount:o.amount,buyer:o.buyer,carName:state.car.name};log('Accepted buyer offer. Sale will complete after the current event.','money',[`Pending sale ${fmt(o.amount)}`]);show('market');return;}completePendingSale(o.amount,o.buyer)}

function declineCarOffer(id){let o=(state.marketOffers||[]).find(x=>x.id===id);if(o)o.closed=true;log('Declined buyer offer.','event');show('market')}
function counterCarOffer(id){let o=(state.marketOffers||[]).find(x=>x.id===id&&!x.closed);if(!o)return;let target=Math.round(o.amount*1.10/50)*50;if(Math.random()<(.35+Math.min(.2,(state.respect||0)*.004))){o.amount=target;o.message+=' Counter accepted.';log('Counter offer accepted: '+fmt(target)+'.','money');}else{o.closed=true;log('Counter offer rejected. Buyer walked away.','event',[`Counter ${fmt(target)}`]);}show('market')}

function upgrades(){if(!state.car)return `<section class="card"><h2>Upgrades</h2><p>Buy a car first.</p></section>`;normaliseState();let c=state.car;calculateBuildEffects(c);let used=workshopUsedToday();let atEvent=workshopBlockedByEvent();let options=currentUpgradeOptions(c);let tuneStatus=tuneSensitiveCount(c)>0?(c.tuneFresh&&c.tuneSignature===buildSignature(c)?'<span class="goodText">Fresh dyno tune</span>':'<span class="warning">Tune-sensitive build needs dyno time</span>'):'<span class="muted">No tune-sensitive mods yet</span>';return `<section class="card"><h2>Upgrade Shop</h2><p class="muted">Phase A upgrade paths are now staged. Tune-sensitive intake, exhaust and ECU mods can have slightly unpredictable results until a full-day dyno tune resolves them. Same-day jobs still use the single daily workshop slot.</p>${workshopStatusText()}<div class="listing"><h3>Current build</h3><p>${installedUpgradeSummary(c).join('<br>')}</p><p>Build tags: ${c.buildTags&&c.buildTags.length?c.buildTags.map(t=>`<span class="issue">${t}</span>`).join(''):'<span class="muted">Stock / unproven</span>'}</p><p>Tune state: ${tuneStatus}</p></div><div class="hr"></div><div class="grid">${options.map(u=>{let blockedSameDay=u.day===0&&used;let disabled=state.money<u.cost||blockedSameDay||atEvent;let reason=atEvent?'At event':state.money<u.cost?'Not enough money':blockedSameDay?'Workshop used today':u.tuneService?'Book dyno tune':'Install';let time=u.day?u.day+' day'+(u.day===1?'':'s'):'same-day / uses today\'s workshop slot';return `<div class="listing"><div class="row"><h3>${u.name}</h3><span class="pill"><b>${u.pathLabel}</b></span></div><p>${u.desc}</p><p class="price">${fmt(u.cost)}</p><p class="small muted">Time: ${time}</p>${u.tuneSensitive?'<p class="small warning">Tune-sensitive: result can vary until dyno tuned.</p>':''}${u.blockedBrands?'<p class="small muted">Platform rule: not available to Toyota/Lexus where listed.</p>':''}${blockedSameDay?'<p class="small warning">Come back function buyUpgrade(id){normaliseState();let c=state.car;if(!c)return;let u=currentUpgradeOptions(c).find(x=>x.id===id);if(!u||state.money<u.cost)return;if(workshopBlockedByEvent()){log('You are still at an event. Finish or leave the event before buying or fitting mods.','event',['Upgrade blocked while participating in event']);return;}if(u.day===0&&workshopUsedToday()){log('The workshop slot has already been used today. Wait until tomorrow before fitting another same-day mod.','event',['Same-day mod blocked']);return;}if(u.tuneService){renderDynoTune(u);return;}let before=snapshot();state.money-=u.cost;applyUpgradeToCar(c,u);let extra=[];if(u.tuneSensitive&&!u.tuneService)extra.push(`Tune variance ${(c.tuneVariance*100).toFixed(1)}% until dyno tuned`);if(u.day===0){state.workshopDayUsed=state.day;logChange('Installed '+u.name+' on '+c.name+'. That used your workshop slot for today.',before,'money',[`Upgrade ${u.name}`,`Time same-day`,...extra]);}else{state.day+=u.day;state.workshopDayUsed=null;logChange('Installed '+u.name+' on '+c.name+' over '+u.day+' day'+(u.day===1?'':'s')+'.',before,'money',[`Upgrade ${u.name}`,`Workshop time ${u.day} day${u.day===1?'':'s'}`,...extra]);processMarketDay();}}
let dynoSession=null;
function renderDynoTune(u){let c=state.car;if(!c)return;calculateBuildEffects(c);dynoSession={upgrade:u,best:null,last:null,running:false,samples:[],runs:[],start:0,raf:null,hold:false};let currentCurve=c.dynoCurve?'<p class="small muted">Current saved curve: '+Math.round(c.dynoCurve.peakHp)+' hp peak, tune quality '+Math.round((c.dynoQuality||1)*100)+'%.</p>':'';document.getElementById('screen').innerHTML=`<section class="card"><div class="row"><div><h2>Dyno Tune</h2><p class="muted">Run the car through the rev range under dyno load. Bring the throttle in smoothly and hold it wide open while the rollers load the engine. A full pull takes around 10–15 seconds.</p></div><span class="pill"><b>${fmt(u.cost)}</b></span></div><div class="dynoStage"><div class="dynoLayout"><div><canvas id="dynoCanvas" class="dynoGraph" width="760" height="260"></canvas><div class="hr"></div><div class="dynoTach"><div class="dynoTachFill" id="dynoTachFill"></div></div><div class="row small muted"><span id="dynoRpm">Idle</span><span id="dynoThrottleRead">Throttle 0%</span><span id="dynoPowerRead">Power -</span></div><p class="raceNote" id="dynoNote">Use the throttle slider, or hold the button, then start a loaded dyno pull. The engine will not free-rev; the rollers load it, so even full throttle takes time to reach redline.</p></div><div class="dynoControls"><div class="dynoStat"><div class="muted">Car</div><div class="value">${c.name}</div><p class="small muted">Redline ${c.red} rpm. Tune-sensitive mods: ${tuneSensitiveCount(c)}.</p>${currentCurve}</div><label class="small muted">Throttle</label><input id="dynoThrottle" class="dynoSlider" type="range" min="0" max="100" value="0" oninput="updateDynoThrottleRead()"><button class="btn secondary dynoHold" id="dynoHoldBtn" onpointerdown="dynoHoldThrottle(true)" onpointerup="dynoHoldThrottle(false)" onpointercancel="dynoHoldThrottle(false)" onpointerleave="dynoHoldThrottle(false)">Hold throttle</button><button class="btn" id="dynoRunBtn" onclick="startDynoRun()">Start baseline pull</button><button class="btn good" id="dynoApplyLastBtn" onclick="acceptDynoTune('last')" disabled>Apply this run and leave</button><button class="btn secondary" id="dynoAcceptBtn" onclick="acceptDynoTune('best')" disabled>Apply best run and leave</button><button class="btn secondary" onclick="show('upgrades')">Back to upgrades</button><div id="dynoResults"></div></div></div></div></section>`;topStats();currentPanel();drawDynoGraph([]);}
function dynoHoldThrottle(on){if(!dynoSession)return;dynoSession.hold=on;let el=document.getElementById('dynoThrottle');if(el){el.value=on?100:Math.min(35,Number(el.value)||0);updateDynoThrottleRead();}}
function updateDynoThrottleRead(){let el=document.getElementById('dynoThrottleRead'),sl=document.getElementById('dynoThrottle');if(el&&sl)el.textContent='Throttle '+sl.value+'%';}
function startDynoRun(){if(!dynoSession||dynoSession.running)return;dynoSession.running=true;dynoSession.samples=[];dynoSession.start=performance.now();dynoSession.loadedRpm=idleRpm(state.car);dynoSession.lastTick=undefined;dynoSession.targetDuration=11000+Math.random()*4000;document.getElementById('dynoRunBtn').disabled=true;let applyBtn=document.getElementById('dynoApplyLastBtn');if(applyBtn)applyBtn.disabled=true;document.getElementById('dynoAcceptBtn').disabled=true;let nextRun=(dynoSession.runs?dynoSession.runs.length:0)+1;document.getElementById('dynoNote').textContent=nextRun===1?'Baseline loaded dyno pull running. Bring the throttle up smoothly and hold it; the rollers are loading the engine.':'Tuning pull running. Keep the throttle strong and smooth while the engine climbs under load.';dynoSession.raf=requestAnimationFrame(tickDynoRun);}
function dynoBaseCurve(c,rpm){let peak=c.peak||c.basePeak||5500;let red=c.red||6500;let low=Math.max(1200,(c.band&&c.band[0])||peak-2200);let width=(c.asp==='turbo'?1700:2100);let shape=Math.exp(-Math.pow((rpm-peak)/width,2));let lowBoost=Math.max(.45,Math.min(1,(rpm-low)/(peak-low+.01)));let fall=rpm>peak?Math.max(.72,1-((rpm-peak)/(red-peak+.01))*.18):1;return Math.max(.35,shape*.78+lowBoost*.22)*fall;}
function tickDynoRun(now){
  if(!dynoSession||!dynoSession.running)return;
  let c=state.car;
  if(dynoSession.loadedRpm===undefined)dynoSession.loadedRpm=idleRpm(c);
  if(dynoSession.lastTick===undefined)dynoSession.lastTick=now;
  let dt=Math.max(.016,Math.min(.08,(now-dynoSession.lastTick)/1000));
  dynoSession.lastTick=now;
  let elapsed=(now-dynoSession.start)/1000;
  let minDur=dynoSession.targetDuration||12500;
  let idle=idleRpm(c);
  let sl=document.getElementById('dynoThrottle');
  if(dynoSession.hold&&sl)sl.value=100;
  let throttle=Number(sl?sl.value:0);
  let throttle01=Math.max(0,Math.min(1,throttle/100));
  let loadFactor=c.asp==='turbo'?0.92:1.0;
  let baseSweepPerSec=(c.red-idle)/(minDur/1000)*loadFactor;
  let throttleDrive=Math.max(0,(throttle01-.18)/.82);
  let ramp=baseSweepPerSec*(.18+throttleDrive*.98);
  if(throttle<45)ramp*=.35;
  if(throttle<18)ramp*=-.20;
  let rpm=dynoSession.loadedRpm+(ramp*dt);
  let softLimit=c.red-80;
  rpm=Math.max(idle,Math.min(softLimit,rpm));
  dynoSession.loadedRpm=rpm;
  let t=Math.max(0,Math.min(1,(rpm-idle)/(c.red-idle)));
  let last=dynoSession.samples[dynoSession.samples.length-1];
  let swing=last?Math.abs(throttle-last.throttle):0;
  let idealThrottle=92;
  let throttleScore=Math.max(.55,1-Math.abs(throttle-idealThrottle)/115);
  let smoothPenalty=Math.min(.16,swing/420);
  let basePower=(c.basePower||c.power||100)*dynoBaseCurve(c,rpm);
  let tuneSens=Math.max(1,tuneSensitiveCount(c));
  let loadBonus=throttle>88?.025:0;
  let raw=basePower*(.92+(throttleScore*.16)-smoothPenalty+loadBonus)*(1+(tuneSens*.006));
  raw+=Math.sin((elapsed/(minDur/1000))*14)*1.5;
  let hp=Math.max(0,raw);
  let torque=hp*7127/Math.max(900,rpm);
  dynoSession.samples.push({rpm,throttle,hp,torque,swing,elapsed});
  updateDynoHud(rpm,throttle,hp,elapsed,minDur/1000);
  drawDynoGraph(dynoSession.samples);
  let completeByRpm=rpm>=softLimit-20;
  let completeByTime=elapsed>=15.5 && rpm>c.red*.82;
  if(completeByRpm||completeByTime){finishDynoRun();return;}
  dynoSession.raf=requestAnimationFrame(tickDynoRun);
}
function updateDynoHud(rpm,throttle,hp,elapsed=0,target=12.5){
  let c=state.car;
  let fill=document.getElementById('dynoTachFill');
  if(fill)fill.style.width=Math.min(100,(rpm/c.red)*100)+'%';
  let r=document.getElementById('dynoRpm');
  if(r)r.textContent=Math.round(rpm)+' rpm';
  let tr=document.getElementById('dynoThrottleRead');
  if(tr)tr.textContent='Throttle '+Math.round(throttle)+'%';
  let pr=document.getElementById('dynoPowerRead');
  if(pr)pr.textContent=Math.round(hp)+' hp';
  let note=document.getElementById('dynoNote');
  if(note&&dynoSession&&dynoSession.running){
    let remaining=Math.max(0,target-elapsed);
    note.textContent='Loaded pull running: '+elapsed.toFixed(1)+'s elapsed. Hold a smooth wide-open throttle; estimated pull time about '+target.toFixed(0)+'s.';
  }
}
function finishDynoRun(){dynoSession.running=false;let samples=dynoSession.samples;let runNo=(dynoSession.runs?dynoSession.runs.length:0)+1;let avgThrottle=samples.reduce((s,x)=>s+x.throttle,0)/Math.max(1,samples.length);let smooth=samples.reduce((s,x)=>s+x.swing,0)/Math.max(1,samples.length);let peakHp=Math.max(...samples.map(x=>x.hp));let peakTorque=Math.max(...samples.map(x=>x.torque));let throttleQuality=Math.max(.75,1-Math.abs(avgThrottle-92)/140);let smoothQuality=Math.max(.82,1-smooth/95);let quality=Math.max(.72,Math.min(1.18,throttleQuality*smoothQuality+0.11));if(runNo===1){quality=Math.min(.98,quality);peakHp*=.965;peakTorque*=.965;}else{let tuneProgress=Math.min(.10,.035*(runNo-1));quality=Math.min(1.18,quality+tuneProgress);peakHp*=1+(tuneProgress*.55);peakTorque*=1+(tuneProgress*.35);}let result={runNo,baseline:runNo===1,quality,peakHp,peakTorque,curve:samples.map((x,i)=>i%3===0?{rpm:Math.round(x.rpm),hp:Math.round(runNo===1?x.hp*.965:x.hp*(1+Math.min(.10,.035*(runNo-1))*.55)),torque:Math.round(runNo===1?x.torque*.965:x.torque*(1+Math.min(.10,.035*(runNo-1))*.35))}:null).filter(Boolean)};dynoSession.last=result;if(!dynoSession.runs)dynoSession.runs=[];dynoSession.runs.push(result);if(!dynoSession.best||result.quality>dynoSession.best.quality)dynoSession.best=result;let best=dynoSession.best===result;document.getElementById('dynoRunBtn').disabled=false;document.getElementById('dynoRunBtn').textContent=runNo===1?'Run tuning pull':'Run again';let applyBtn=document.getElementById('dynoApplyLastBtn');if(applyBtn)applyBtn.disabled=false;document.getElementById('dynoAcceptBtn').disabled=false;document.getElementById('dynoNote').textContent=runNo===1?'Baseline pull complete. You can apply these changes now, or keep tuning to chase a cleaner curve.':best?'Best pull so far. Apply this run, apply the best run, or run again to chase more.':'This pull is usable, though your best curve is still stronger.';renderDynoResults();}
function renderDynoResults(){let box=document.getElementById('dynoResults');if(!box||!dynoSession)return;let last=dynoSession.last,best=dynoSession.best;if(!last){box.innerHTML='';return;}let lastTitle=last.baseline?'Baseline Pull - non optimised':'Last Tuning Pull';let lastNote=last.baseline?'This is the first baseline result before the tune is properly dialled in.':'This run can be applied now if you like the curve.';box.innerHTML=`<div class="dynoResult ${last===best?'best':''}"><h3>${lastTitle}</h3><p>Peak: <b>${Math.round(last.peakHp)} hp</b> / ${Math.round(last.peakTorque)} Nm</p><p>Tune quality: <b>${Math.round(last.quality*100)}%</b></p><p class="small muted">${lastNote}</p></div><div class="dynoResult best" style="margin-top:8px"><h3>Best Available Tune</h3><p>Peak: <b>${Math.round(best.peakHp)} hp</b> / ${Math.round(best.peakTorque)} Nm</p><p>Quality if applied: <b>${Math.round(best.quality*100)}%</b></p></div>`;}
function drawDynoGraph(samples){let canvas=document.getElementById('dynoCanvas');if(!canvas)return;if(canvas.clientWidth){canvas.width=Math.max(320,Math.floor(canvas.clientWidth*window.devicePixelRatio));canvas.height=Math.max(220,Math.floor(canvas.clientHeight*window.devicePixelRatio));}let ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#05070a';ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;for(let i=1;i<6;i++){let y=i*h/6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='12px system-ui';ctx.fillText('Power curve',14,20);if(!samples||samples.length<2){ctx.fillText('Run the car to draw a curve',14,44);return;}let maxHp=Math.max(80,...samples.map(x=>x.hp));let minRpm=samples[0].rpm,maxRpm=samples[samples.length-1].rpm;ctx.strokeStyle='#ffb02e';ctx.lineWidth=3;ctx.beginPath();samples.forEach((x,i)=>{let px=(x.rpm-minRpm)/Math.max(1,maxRpm-minRpm)*w;let py=h-((x.hp/maxHp)*(h-34))-18;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.stroke();ctx.strokeStyle='#8ecae6';ctx.lineWidth=2;ctx.beginPath();samples.forEach((x,i)=>{let px=(x.rpm-minRpm)/Math.max(1,maxRpm-minRpm)*w;let py=h-((x.torque/Math.max(100,...samples.map(s=>s.torque)))*(h-34))-18;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.stroke();ctx.fillStyle='#ffb02e';ctx.fillText('HP',w-54,22);ctx.fillStyle='#8ecae6';ctx.fillText('Torque',w-54,40);}
function acceptDynoTune(which='best'){if(!dynoSession||!state.car)return;let chosen=which==='last'?dynoSession.last:dynoSession.best;if(!chosen)return;let u=dynoSession.upgrade,c=state.car;if(state.money<u.cost){alert('Not enough money to pay for the dyno tune.');return;}let before=snapshot();state.money-=u.cost;applyUpgradeToCar(c,u,chosen);state.day+=u.day;state.workshopDayUsed=null;let chosenLabel=which==='last'?'this dyno run':'the best dyno run';logChange('Applied '+chosenLabel+' to '+c.name+'. The tune-sensitive build is now sorted and the curve has been saved.',before,'money',[`Dyno tune ${fmt(u.cost)}`,`Run ${chosen.runNo}${chosen.baseline?' baseline':''}`,`Tune quality ${Math.round((c.dynoQuality||1)*100)}%`,`Peak dyno pull ${Math.round(chosen.peakHp)} hp`,`Workshop time ${u.day} day`]);dynoSession=null;processMarketDay();state.screen='garage';render();}

function normaliseState(){
  if(!state.completedEvents)state.completedEvents={};
  if(!state.bestETs)state.bestETs={};
  if(state.pendingArrival===undefined)state.pendingArrival=null;
  if(state.workshopDayUsed===undefined)state.workshopDayUsed=null;
  normaliseAccounting();
  if(state.car)calculateBuildEffects(state.car);
  if(state.lastEvent){
    if(state.lastEvent.raceHistory===undefined)state.lastEvent.raceHistory={};
    if(state.lastEvent.roundNo===undefined)state.lastEvent.roundNo=0;
    if(state.lastEvent.lineup===undefined)state.lastEvent.lineup=[];
    if(state.lastEvent.queueIndex===undefined)state.lastEvent.queueIndex=0;
    if(state.lastEvent.selectedOpponentIndex===undefined)state.lastEvent.selectedOpponentIndex=null;
    if(state.lastEvent.eventAccounting===undefined)state.lastEvent.eventAccounting=[];
    if(state.lastEvent.raceReports===undefined)state.lastEvent.raceReports=[];
    if(state.lastEvent.eventStartMoney===undefined)state.lastEvent.eventStartMoney=state.money;
    if(state.lastEvent.eventStartRespect===undefined)state.lastEvent.eventStartRespect=state.respect;
  }

function crowdAtmosphere(busy){
  if(!busy)return 'People are milling around the pits.';
  if(busy.name==='Quiet night')return 'The place feels quiet, with room in the lanes and a relaxed crowd.';

function eventSeed(ev,day=state.day){return hashSeed((ev.id||ev.name)+'|'+day+'|'+(ev.offset||0)+'|'+(ev.travelCost||0));}

function eventNarrative(ev,busy,day=state.day){
  let data=EVENT_STORIES[ev.id]||EVENT_STORIES.heathcote_legal;
  let seed=eventSeed(ev,day);
  let crowd = crowdAtmosphere(busy);
  if(state.respect>=25) crowd += ' People clock you a little more quickly now that you have some respect behind your name.';
  if((busy&&busy.name)==='Packed night') crowd += ' Spectators are stacked deep along the fence.';

}
function finishTravel(){

function cancelArrival(){

function travelToEvent(eventId='heathcote_legal'){

  let busy=eventProfile(ev);
  let field=makeOpponents(busy.cars,ev);
  let raceSlots=pickRaceSlots(field,busy.raceSlots);
  let story=eventNarrative(ev,busy,state.day);
  state.pendingArrival={eventId:ev.id,eventName:ev.name,eventDef:ev,busy,totalCars:field.length,opponents:field,raceSlots,story,weather:story.weather};
  state.screen='travel';

function eventProfile(ev=EVENT_CALENDAR[0]){let roll=Math.random();let base=roll<.25?{name:'Quiet night',runs:10,raceSlots:4,cars:18,watch:18}:roll<.6?{name:'Normal night',runs:6,raceSlots:6,cars:34,watch:30}:roll<.87?{name:'Busy night',runs:4,raceSlots:8,cars:56,watch:44}:{name:'Packed night',runs:2,raceSlots:8,cars:74,watch:58};base.cars=Math.round(base.cars*(ev.fieldMult||1));base.watch=Math.round(base.watch*(ev.fieldMult||1));base.raceSlots=Math.min(base.raceSlots+Math.floor((ev.reqRespect||0)/10),14);return base;}
function startEvent(kind,eventId='heathcote_legal'){travelToEvent(eventId);}
function makeOpponents(n,ev=null){let pool=CARS.filter(c=>c.price<34000);let names=['Mick','Sarah','Davo','Jess','Rob','Tayla','Chris','Ari','Ben','Mia','Noah','Eli','Zoe','Jay','Sam','Alex','Riley','Casey'];return Array.from({length:n},(_,i)=>{let base=choice(pool);let trans=base.manual&&(!base.auto||Math.random()<.55)?'manual':'auto';let o=makeOwned(base,trans);let tier=i/n;let level=rand(.9,1.14)+(state.respect/260)+(tier>.75?rand(.02,.12):0)+(ev?ev.opponentBoost||0:0);o.power*=level;o.grip+=rand(-.035,.09)+(tier>.75?.025:0);if(Math.random()<.18){o.weight-=rand(25,90);o.mods.push('Light interior strip');}o.visible=visibleClues(o);o.label=tier>.88?'quick regular':tier>.7?'serious local':'local car';o.driver=choice(names);o.eventIndex=i;o.entryId=o.id+'_'+i+'_'+Math.random().toString(16).slice(2);return o;});}
function perfIndex(c){let driveBonus=(c.drive==='AWD'||c.drive==='4WD')?1.035:1;let aeroPenalty=1-Math.max(0,(c.aero||.32)-.32)*.12;return (c.power/Math.max(700,c.weight))*(c.grip||.84)*driveBonus*aeroPenalty;}
function pickRaceSlots(field,n){
  if(!state.car){return field.slice(0,Math.min(n,field.length)).map((_,i)=>i)}
  let playerScore=perfIndex(state.car);
  let scored=field.map((o,i)=>({i,score:perfIndex(o),gap:Math.abs(perfIndex(o)-playerScore)}));
  let matched=scored.slice().sort((a,b)=>a.gap-b.gap).slice(0,Math.min(n,field.length));
  let obviouslySlower=scored.filter(x=>x.score<playerScore*.88);
  let combined=[];
  for(const item of [...matched,...obviouslySlower]){if(!combined.includes(item.i))combined.push(item.i)}
  return combined.sort((a,b)=>a-b);

function handleLiveShift(){
  if(!liveRun||!liveRun.start||liveRun.finished||!liveRun.playerCanShift)return;
  let elapsed=(performance.now()-liveRun.start)/1000;
  if(elapsed-liveRun.lastShiftAt<.25){liveRun.penalty+=.12;liveRun.note='Double-tap shift error. The car hesitated.';return;}
  if(liveRun.gear>=gearMaxes(liveRun.playerCar).length){liveRun.note='No more gears.';return;}
  let rpm=currentRpmForRun(liveRun.playerCar,liveRun.gear,elapsed,liveRun.playerBase.et+liveRun.penalty,liveRun.playerBase.trap,liveRun.playerBase.launchProfile);
  let target=shiftTarget(liveRun.playerCar), diff=rpm-target;
  let msg='Good shift.';
  if(diff<-650){liveRun.penalty+=.22;msg='Shifted too early and dropped out of the power band.';}
  else if(diff>500){liveRun.penalty+=.18;msg='Shifted late; acceleration had already fallen away.';}
  else if(Math.abs(diff)<220){liveRun.penalty-=.03;msg='Sharp shift, right in the useful power band.';}
  liveRun.gear++;liveRun.lastShiftAt=elapsed;liveRun.shiftEvents.push({gear:liveRun.gear,rpm,diff});liveRun.note=msg;
}
function finishLiveRace(pEt){
  liveRun.finished=true;

  player.accel=player.gs.vals[player.gs.vals.length-1];
  let rival=liveRun.rival;
  let win=player.et<rival.et;
  let ev=state.lastEvent&&state.lastEvent.eventDef?state.lastEvent.eventDef:EVENT_CALENDAR[0];
  let record=getEventRaceRecord(liveRun.rivalCar);

  let cash=rewards.cash;
  let respectGain=rewards.respect;
  let before=snapshot();
  state.money+=cash;state.respect+=respectGain;state.car.reliability-=player.stress+(liveRun.penalty*.25);if(state.car){state.car.bestET=state.car.bestET?Math.min(state.car.bestET,player.et):player.et;if(win)state.car.wins=(state.car.wins||0)+1;if(win&&liveRun.rivalCar&&liveRun.rivalCar.power>state.car.power*1.08){state.car.sceneValue=(state.car.sceneValue||0)+1;state.car.notableEvents=(state.car.notableEvents||[]);state.car.notableEvents.push('Upset win over '+liveRun.rivalCar.name+' on Day '+state.day);}}
  record.attempts++; if(win)record.wins++; else record.losses++;
  let shiftText=liveRun.playerCanShift?`${liveRun.shiftEvents.length} manual shifts. `:'';
  let details=[win?'Result win':'Result loss',`Your ET ${player.et.toFixed(2)} @ ${player.trap.toFixed(0)} km/h`,`Opponent ${rival.et.toFixed(2)} @ ${rival.trap.toFixed(0)} km/h`,`Runs left ${state.lastEvent?state.lastEvent.runsLeft:0}`,`Opponent race count tonight ${record.attempts}`,...rewards.details];
  details.push(`Launch ${liveRun.style} / ${Math.round(liveRun.playerBase.effectiveLaunchRpm||liveRun.launch)} rpm`);
  if(liveRun.playerCanShift)details.push(`Manual shifts ${liveRun.shiftEvents.length}`);
  if(cash)details.push(`Win payout ${fmt(cash)}`);details.push(`Respect gain ${respectGain.toFixed(1)}`);
  let raceReport={day:state.day,season:seasonForDay(state.day),result:win?'WIN':'LOSS',win,opponent:liveRun.rivalCar.name,yourEt:player.et,yourTrap:player.trap,yourSixty:player.sixty,yourEighth:player.eighth,oppEt:rival.et,oppTrap:rival.trap,cashDelta:cash,respectDelta:respectGain,notes:rewards.details.slice()};
  player.report=raceReport;
  if(state.lastEvent){if(!state.lastEvent.raceReports)state.lastEvent.raceReports=[];state.lastEvent.raceReports.push(raceReport);}
  let summary=`You raced ${liveRun.rivalCar.name}. You ran ${player.et.toFixed(2)} @ ${player.trap.toFixed(0)} km/h. Opponent ran ${rival.et.toFixed(2)} @ ${rival.trap.toFixed(0)}. ${win?'Win +'+fmt(cash)+'.':'Loss.'} Respect +${respectGain.toFixed(1)}. ${player.feedback}${shiftText}${liveRun.note}`;
  state.lastRace=player;logChange(summary,before,'race',details);markCurrentLineupRaceComplete();renderRace(player,rival,win,summary);queueSocialRace(player,win);
}
function renderRace(player,rival,win,summary){let report=player.report||{result:win?'WIN':'LOSS',cashDelta:win?0:0,respectDelta:0,notes:[]};let notes=report.notes&&report.notes.length?`<p class="small warning">Reward notes: ${report.notes.join(', ')}</p>`:'';document.getElementById('screen').innerHTML=`<section class="card"><h2>Race Report</h2><p>${summary}</p><div class="raceHud"><div class="gauge"><div class="muted">Result</div><div class="value ${win?'goodText':'badText'}">${report.result}</div></div><div class="gauge"><div class="muted">Cash</div><div class="value ${report.cashDelta>=0?'goodText':'badText'}">${signedMoney(report.cashDelta||0)}</div></div><div class="gauge"><div class="muted">Respect</div><div class="value goodText">${signedNumber(report.respectDelta||0,1)}</div></div><div class="gauge"><div class="muted">Opponent</div><div class="value" style="font-size:16px">${liveRun?liveRun.rivalCar.name:'-'}</div></div></div><div class="hr"></div><h3>Useful Race Data</h3><div class="raceHud"><div class="gauge"><div class="muted">ET</div><div class="value">${player.et.toFixed(2)}s</div></div><div class="gauge"><div class="muted">Trap</div><div class="value">${player.trap.toFixed(0)} km/h</div></div><div class="gauge"><div class="muted">60 foot</div><div class="value">${player.sixty.toFixed(2)}s</div></div><div class="gauge"><div class="muted">1/8 mile</div><div class="value">${player.eighth.toFixed(2)}s</div></div><div class="gauge"><div class="muted">Opponent ET</div><div class="value">${rival.et.toFixed(2)}s</div></div><div class="gauge"><div class="muted">Opponent trap</div><div class="value">${rival.trap.toFixed(0)} km/h</div></div></div>${notes}<div class="hr"></div><h3>G-Meter Sparkline</h3><div class="spark">${player.gs.spark}</div><p class="muted">Last acceleration sample: ${player.accel.toFixed(2)} g. Falling bars suggest the car was no longer accelerating as hard.</p><div class="track"><div class="trackFill" style="width:100%"></div></div><div class function renderWatchRun(carA,carB,r1,r2,betData){
  let run={start:null,countStart:performance.now()};
  document.getElementById('screen').innerHTML=`<section class="card"><h2>Watching a pass</h2><p class="muted">The timing boards come up after the cars complete the quarter mile.</p><div class="raceStage"><div id="watchCountdown" class="bigCountdown">3</div><div class="lane"><div class="laneTop"><b>${carA.name}</b><span id="watchAText">0 m</span></div><div class="laneBar"><div id="watchALane" class="laneFill"></div><div id="watchADot" class="carDot">🚗</div></div></div><div class="lane"><div class="laneTop"><b>${carB.name}</b><span id="watchBText">0 m</span></div><div class="laneBar"><div id="watchBLane" class="laneFill rival"></div><div id="watchBDot" class="carDot">🚙</div></div></div><div class="raceHud"><div class="gauge"><div class="muted">Elapsed</div><div class="value" id="watchTime">0.00s</div></div><div class="gauge"><div class="muted">Leader</div><div class="value" id="watchLeader">-</div></div><div class="gauge"><div class="muted">Board</div><div class="value" id="watchBoard">WAIT</div></div></div></div></section>`;

    if(!run.start){let left=3-((now-run.countStart)/1000);document.getElementById('watchCountdown').textContent=left>0?Math.ceil(left):'GO';if(left<=-.25){run.start=now;document.getElementById('watchCountdown').textContent='GO';}requestAnimationFrame(tick);return;}

function finishWatchRun(carA,carB,r1,r2,betData){
  let winner=r1.et<r2.et?carA:carB;
  let msg=`Watched ${carA.name} run ${r1.et.toFixed(2)} @ ${r1.trap.toFixed(0)} km/h against ${carB.name} (${r2.et.toFixed(2)} @ ${r2.trap.toFixed(0)}).`;
  let before=snapshot();
  let details=[`Winner ${winner.name}`,`${carA.name} ${r1.et.toFixed(2)} @ ${r1.trap.toFixed(0)} km/h`,`${carB.name} ${r2.et.toFixed(2)} @ ${r2.trap.toFixed(0)} km/h`];
  if(betData.bet){
    details.push(`Picked ${betData.picked.name}`,`Stake ${fmt(betData.stake)}`);if(betData.approach)details.push(`Approach ${betData.approach}`);
    if(betData.picked===winner){state.money+=betData.stake*2;state.respect+=1;msg+=' Side bet won: +'+fmt(betData.stake)+'.';details.push('Bet result win');}
    else {msg+=' Side bet lost.';details.push('Bet result loss');}
    let e=state.lastEvent;
    if(e&&e.kind==='race'&&Math.random()<((betData.approach==='quiet'?.035:.08)+betData.stake/450)){
      e.runsLeft=Math.max(0,e.runsLeft-1);e.missed++;
      let loss=e.missed===1?2:e.missed===2?4:8;
      state.respect=Math.max(-20,state.respect-loss);
      msg+=' You got distracted and missed a lane call. Respect -'+loss+'.';
      details.push(`Missed lane call ${e.missed}`,`Runs left ${e.runsLeft}`,`Lane-call penalty -${loss} Respect`);
      logChange(msg,before,'bad',details);
      if(e.missed>=3){completeEventNight('You missed too many lane calls and were told to call it a night.','bad');return;}
      markCurrentLineupRaceComplete();showTimingBoard(carA,carB,r1,r2,winner,msg);return;
    }
    logChange(msg,before,'bet',details);
  }else{
    state.respect+=.1;
    details.push('Spectating Respect +0.1');
    logChange(msg,before,'event',details);
  }
  markCurrentLineupRaceComplete();showTimingBoard(carA,carB,r1,r2,winner,msg);
}

async function cloudSave(notify=false){localStorage.setItem('qmb_mvp_save',JSON.stringify(state));if(!localStorage.getItem(QMB_RECOVERY_STORAGE)){if(notify)alert('Local backup saved. Create an anonymous garage to sync online.');return}let data=await socialRequest({action:'save',state});if(notify)alert(data?'Career synced to the cloud.':socialError)}
async function cloudLoad(){if(!socialData||!socialData.save||!socialData.save.state)return alert('No cloud career found.');if(!confirm('Load your cloud career and replace the current local session?'))return;state=socialData.save.state;localStorage.setItem('qmb_mvp_save',JSON.stringify(state));log('Cloud career loaded.','event',['Online sync']);render()}
async function addFriend(){let input=document.getElementById('friendCodeInput');let code=input?input.value:'';let data=await socialRequest({action:'addFriend',code});if(data){alert('Friend added. Their progress now appears here.');render()}}
async function renameDriver(){let current=socialData&&socialData.profile?socialData.profile.displayName:'Driver';let displayName=prompt('Choose a public driver name (2-30 characters):',current);if(displayName===null)return;let data=await socialRequest({action:'profile',displayName});if(data)render()}
async function copyRecoveryCode(){let code=localStorage.getItem(QMB_RECOVERY_STORAGE)||'';if(!code)return;try{await navigator.clipboard.writeText(code);alert('Recovery code copied. Keep it private.')}catch{prompt('Copy this recovery code and keep it private:',code)}}
function toggleRecoveryCode(){recoveryCodeRevealed=!recoveryCodeRevealed;if(state.screen==='social')document.getElementById('screen').innerHTML=social()}
function inviteUrl(code){return location.origin+location.pathname+'?invite='+encodeURIComponent(code)}
async function copyInviteLink(){let code=socialData&&socialData.invite?socialData.invite.code:'';if(!code)return;let url=inviteUrl(code);try{await navigator.clipboard.writeText(url);alert('Invite link copied. Send it to a friend.')}catch{prompt('Copy this invitation link:',url)}}
async function shareInviteLink(){let code=socialData&&socialData.invite?socialData.invite.code:'';if(!code)return;let url=inviteUrl(code);if(navigator.share){try{await navigator.share({title:'Quarter Mile Builder invite',text:'Join my garage and compare your quarter-mile progress.',url});return}catch(err){if(err&&err.name==='AbortError')return}}await copyInviteLink()}
function forgetGarage(){if(!confirm('Forget this garage on this device? Make sure you copied the recovery code first.'))return;localStorage.removeItem(QMB_RECOVERY_STORAGE);socialData=null;socialError='';recoveryCodeRevealed=false;render()}
async function queueSocialRace(player,won){if(!socialData||!state.car)return;await socialRequest({action:'recordRace',race:{carName:state.car.name,et:player.et,trap:player.trap,power:state.car.power,won}});await cloudSave(false)}
function season(){normaliseAccounting();let seasons=[...new Set(state.accounting.map(x=>x.season))].sort((a,b)=>a-b);let currentSeason=seasonForDay(state.day);if(!seasons.includes(currentSeason))seasons.push(currentSeason);let selected=state.accountingSeason||'all';let opts=['all',...seasons].map(s=>`<option value="${s}" ${String(selected)===String(s)?'selected':''}>${s==='all'?'All seasons':'Season '+s}</option>`).join('');let entries=state.accounting.filter(x=>selected==='all'||String(x.season)===String(selected));let summaries=(state.eventSummaries||[]).filter(x=>selected==='all'||String(x.season)===String(selected));let cashIn=sumAccounting(entries,'cashDelta',x=>x.cashDelta>0),cashOut=sumAccounting(entries,'cashDelta',x=>x.cashDelta<0),cashNet=sumAccounting(entries,'cashDelta'),respectIn=sumAccounting(entries,'respectDelta',x=>x.respectDelta>0),respectOut=sumAccounting(entries,'respectDelta',x=>x.respectDelta<0),respectNet=sumAccounting(entries,'respectDelta');let eventRows=summaries.length?summaries.slice().reverse().map(x=>`<tr><td>Day ${x.day}</td><td>${x.eventName}</td><td>${x.winCount}-${x.lossCount}</td><td class="${x.cashNet>=0?'goodText':'badText'}">${signedMoney(x.cashNet)}</td><td class="${x.respectNet>=0?'goodText':'badText'}">${signedNumber(x.respectNet,1)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No completed events recorded for this selection.</td></tr>';return `<section class="card"><div class="row"><div><h2>Season Balance Sheet</h2><p class="muted">Track earnings, costs, Respect gains and profitability by season. A season is currently 14 in-game days.</p></div><select class="select" onchange="state.accountingSeason=this.value;render()">${opts}</select></div><div class="raceHud"><div class="gauge"><div class="muted">Cash income</div><div class="value goodText">${fmt(cashIn)}</div></div><div class="gauge"><div class="muted">Cash costs</div><div class="value badText">${fmt(Math.abs(cashOut))}</div></div><div class="gauge"><div class="muted">Cash net</div><div class="value ${cashNet>=0?'goodText':'badText'}">${signedMoney(cashNet)}</div></div><div class="gauge"><div class="muted">Respect net</div><div class="value ${respectNet>=0?'goodText':'badText'}">${signedNumber(respectNet,1)}</div></div></div><div class="hr"></div><h3>Completed event statements</h3><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Day</th><th align="left">Event</th><th align="left">W-L</th><th align="left">Cash P/L</th><th align="left">Respect</th></tr></thead><tbody>${eventRows}</tbody></table><div class="hr"></div><h3>Cash and Respect ledger</h3><div class="log" style="max-height:420px"><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Day</th><th align="left">Type</th><th align="left">Item</th><th align="left">Cash</th><th align="left">Respect</th></tr></thead><tbody>${balanceTableRows(entries.slice().reverse())}</tbody></table></div></section>`}
function logScreen(){return `<section class="card"><h2>Log</h2><p class="muted">Every money, Respect, event and penalty change is shown here to make testing easier.</p><div class="log">${state.log.length?state.log.map(renderLogEntry).join(''):'<div class="muted">No log entries yet.</div>'}</div></section>`}
function saveGame(){localStorage.setItem('qmb_mvp_save',JSON.stringify(state));log('Local backup saved.');cloudSave(true);}
function loadGame(manual=false){if(manual&&socialData&&socialData.save)return cloudLoad();let s=localStorage.getItem('qmb_mvp_save');if(s){state=JSON.parse(s);if(manual)log('Local backup loaded.')}else if(manual)alert('No local or cloud save found.');render();}
function resetGame(){if(confirm('Reset the game?')){localStorage.removeItem('qmb_mvp_save');state={money:15000,respect:0,day:1,car:null,owned:[],listings:[],log:[],screen:'home',watch:[],watchCap:5,lastEvent:null,pendingArrival:null,bettingUnlocked:false,completedEvents:{},bestETs:{},workshopDayUsed:null,accounting:[],eventSummaries:[],accountingSeason:'all',marketOffers:[],pendingSale:null};refreshListings();render();}}
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();handleLiveShift();}});
refreshListings();loadGame(false);render();initSocial();
</script>
</body>
