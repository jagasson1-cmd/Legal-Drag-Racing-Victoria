    .raceStage{background:linear-gradient(180deg,#12161d,#090b0f);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}.raceLayout{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:16px;align-items:start}.raceSide{display:flex;justify-content:center}.lane{margin:12px 0}.laneTop{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}.laneBar{height:24px;background:#07090d;border:1px solid var(--line);border-radius:999px;position:relative;overflow:hidden}.laneFill{height:100%;background:linear-gradient(90deg,#3a4553,var(--accent));width:0%;transition:width .08s linear}.laneFill.rival{background:linear-gradient(90deg,#3a4553,var(--blue))}.carDot{position:absolute;top:2px;left:0%;transform:translateX(-50%);font-size:17px;line-height:18px;filter:drop-shadow(0 2px 2px #000)}.tachWrap{margin-top:10px}.tachLabels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:0 2px 5px}.tach{height:22px;background:linear-gradient(90deg,#112d1c 0 58%,#463d16 58% 82%,#4b1717 82% 100%);border:1px solid var(--line);border-radius:999px;overflow:hidden;position:relative}.tachFill{height:100%;width:0%;background:rgba(255,255,255,.18);border-right:3px solid var(--text);transition:width .06s linear}.tachMark{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}.tachBandText{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}.shiftLight{font-weight:900;letter-spacing:1px;color:var(--muted)}.shiftLight.on{color:var(--accent);text-shadow:0 0 12px rgba(255,176,46,.7)}.bigCountdown{font-size:54px;font-weight:900;color:var(--accent);text-align:center;margin:8px 0}.raceNote{min-height:22px}.timingBoard{background:#05070a;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:ui-monospace,Consolas,monospace}.timingBoard .winner{color:var(--good)}.treeBox{display:flex;flex-direction:column;justify-content:flex-     .dynoStage{background:linear-gradient(180deg,#111820,#07090d);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}.dynoLayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.dynoGraph{width:100%;height:260px;background:#05070a;border:1px solid var(--line);border-radius:14px}.dynoTach{height:26px;background:linear-gradient(90deg,#112d1c 0 60%,#463d16 60% 84%,#4b1717 84% 100%);border:1px solid var(--line);border-radius:999px;overflow:hidden;position:relative}.dynoTachFill{height:100%;width:0%;background:rgba(255,255,255,.2);border-right:3px solid var(--accent)}.dynoControls{display:flex;flex-direction:column;gap:10px}.dynoSlider{width:100%;accent-color:var(--accent)}.dynoHold{user-select:none;touch-action:none}.dynoStat{background:#0e1116;border:1px solid var(--line);border-radius:12px;padding:10px}.dynoStat .value{font-size:20px;font-weight:800;color:var(--accent)}.dynoResult{border:1px solid var(--line);border-radius:14px;padding:12px;background:#151a22}.dynoResult.best{border-color:var(--good)}

<body>
<header>
  <div><h1>Quarter Mile Builder</h1><div class="tagline">Independent public beta - build, race and compare</div></div>
  <div class="stats" id="topStats"></div>
</header>
<main>
  <aside class="sidebar">
    <section class="card menuCard">
      <h3>Menu</h3>
      <div class="nav" id="nav"></div>
    </section>
    <section class="card carCard">
      <h3>Current Car</h3>
      <div id="currentCarPanel" class="muted">No car yet.</div>
    </section>
    <section class="card progressCard">
      <h3>Progress</h3>
      <div class="btns">
        <button class="btn secondary" onclick="saveGame()">Save</button>
        <button class="btn secondary" onclick="loadGame(true)">Load</button>
        <button class="btn danger" onclick="resetGame()">Reset</button>
      </div>
      <button id="soundToggle" class="btn secondary" style="width:100%;margin-top:10px" onclick="toggleSound()" aria-pressed="true">Sound: On</button>
      <p class="footerNote">Local backup plus online sync with a recovery code.</p>
    </section>
    <section class="card multiplayerCard">
      <h3>Multiplayer</h3>
      <div id="socialPanel" class="muted small">Connecting to the paddock...</div>
    </section>
  </aside>
  <section id="screen" class="screen"></section>
</main>
<div class="marketToast" id="marketToast" role="status" aria-live="polite" onclick="openMarketNotification()">
  <span class="marketToastIcon" aria-hidden="true">✉</span>

</div>
<div class="marketToast guidanceToast" id="guidanceToast" role="status" aria-live="polite" onclick="openPendingNotification()">

</div>

function buyCar(id){normaliseGarageState();let l=state.listings.find(x=>x.id===id);if(!l)return;let base=carById(l.carId);if(state.money<l.price)return;if(state.owned.length>=state.garageCapacity){alert(`Your garage is full (${state.owned.length}/${state.garageCapacity}). List a car and wait for it to sell, or unlock more capacity with Respect.`);return}if(!l.trans)l.trans=rollListingTrans(base);let trans=l.trans;if(trans==='manual'&&!base.manual)trans='auto';if(trans==='auto'&&!base.auto)trans='manual';let mode=trans==='auto'?'D':'manual';let before=snapshot();let car=makeOwned(base,trans,mode,l);let eventLocked=hasEventSession();let eventCar=state.car;state.money-=l.price;state.owned.push(car);if(!eventLocked){state.activeCarId=car.uid;state.car=car}else if(eventCar){state.activeCarId=eventCar.uid;state.car=eventCar}state.listings=state.listings.filter(x=>x.id!==id);createGuidanceNotification('firstCar');let details=[`Vehicle purchase ${car.name}`,`As-listed transmission ${trans.toUpperCase()}`,`Garage ${state.owned.length}/${state.garageCapacity}`];if(eventLocked)details.push(`Delivered to garage - ${eventCar?eventCar.name:'current event vehicle'} remains active`);else details.push('New car selected as active');logChange(eventLocked?'Bought '+car.name+' for '+fmt(l.price)+'. It has been delivered to your garage.':'Bought '+car.name+' for '+fmt(l.price)+'.',before,'money',details);state.screen=eventLocked?'currentEvent':'garage';render();}

function estimateCarValue(c){
  if(!c)return {privateValue:0,wholesaleValue:0};
  calculateBuildEffects(c);
  let base=carById(c.id)?.price||c.price||5000;
  let modValue=c.modMarketValue||0;
  let rel=Math.max(.55,Math.min(1.08,(c.reliability||85)/88));
  let perf=(c.power/(c.basePower||carById(c.id)?.power||c.power||1));
  let perfValue=base*(perf-1)*.55;
  let scene=(c.sceneValue||0)*280;
  let best=c.bestET?Math.max(0,(16-c.bestET))*130:0;
  let tunePenalty=(tuneSensitiveCount(c)>0&&!(c.tuneFresh&&c.tuneSignature===buildSignature(c)))?-.06:0;
  let privateValue=Math.max(800,Math.round((base+modValue+perfValue+scene+best)*(rel+tunePenalty)));
  let wholesaleValue=Math.max(500,Math.round(privateValue*rand(.58,.72)));
  return {privateValue,wholesaleValue};
}
function listingMultiplier(mode){return mode==='quick'?.92:mode==='optimistic'?1.12:mode==='dreaming'?1.28:1.0}

function market(){normaliseState();normaliseGarageState();if(!state.car)return `<section class="card"><h2>Car Market</h2><p class="muted">Buy a car first.</p></section>`;let c=state.car,v=estimateCarValue(c),otherListed=listedCar();let offers=(state.marketOffers||[]).filter(o=>!o.closed&&o.vehicleId===c.uid);let listingBlocked=otherListed&&otherListed.uid!==c.uid;let pending=state.pendingSale&&state.pendingSale.vehicleId===c.uid?state.pendingSale:null;return `<section class="card"><div class="row"><div><h2>Car Market</h2><p class="muted">Selling remains deliberate: list a selected car, keep using it, and wait for an offer. Only one vehicle can be advertised at a time.</p></div><button class="btn secondary" onclick="show('garage')">Back to garage</button></div><div class="grid"><div class="listing"><h3>${c.name}</h3><p>${c.listedForSale?'<span class="warning">Listed and still drivable</span>':'Not currently listed.'}</p><p>Estimated private value: <b>${fmt(v.privateValue)}</b></p><p>Instant wholesaler offer: <b>${fmt(v.wholesaleValue)}</b></p><p class="small muted">Wholesale is quick and deliberately low. Classifieds can pay better but take time and invite lowballers.</p><div class="btns"><button class="btn danger" onclick="instantSellCar()">Sell immediately</button>${c.listedForSale?`<button class="btn secondary" onclick="cancelCarListing()">Cancel listing</button>`:''}</div></div><div class="listing"><h3>List in classifieds</h3>${listingBlocked?`<p class="warning">${otherListed.name} is already advertised. Select it in the garage to manage that listing.</p>`:'<p class="muted">Choose how ambitious the asking price is. Buyer offers arrive through this market screen and the event log.</p>'}<div class="btns"><button class="btn secondary" onclick="listCarForSale('quick')" ${listingBlocked?'disabled':''}>Quick Sale</button><button class="btn secondary" onclick="listCarForSale('fair')" ${listingBlocked?'disabled':''}>Fair Price</button><button class="btn secondary" onclic function offerCard(o){return `<div class="listing"><h3>${o.buyer}</h3><p>${o.message}</p><p>Offer: <b>${fmt(o.amount)}</b></p><p class="small muted">${o.kind||'classified'} offer / Day ${o.day}</p><div class="btns"><button class="btn" onclick="acceptCarOffer('${o.id}')">Accept</button><button class="btn secondary" onclick="counterCarOffer('${o.id}')">Counter +10%</button><button class="btn secondary" onclick="declineCarOffer('${o.id}')">Decline</button></div></div>`}
function listCarForSale(mode='fair'){normaliseState();normaliseGarageState();if(!state.car)return;let existing=listedCar();if(existing&&existing.uid!==state.car.uid){alert(existing.name+' is already listed. Only one car can be advertised at a time.');return}state.car.listedForSale=true;state.car.saleMode=mode;state.car.listedDay=state.day;log('Listed '+state.car.name+' in the classifieds: '+listingLabel(mode)+'.','money',[`Still drivable while listed`]);show('market')}

function instantSellCar(){normaliseState();normaliseGarageState();if(!state.car)return;let v=estimateCarValue(state.car),soldCar=state.car;let before=snapshot();let sold=soldCar.name;state.money+=v.wholesaleValue;removeOwnedCar(soldCar.uid);if(state.pendingSale&&state.pendingSale.vehicleId===soldCar.uid)state.pendingSale=null;checkRelevantBadges('vehicle_transferred',{transferId:`sale_${soldCar.uid}_${state.day}_${Date.now()}`,day:state.day,carId:soldCar.uid,carName:sold,type:'sale'});logChange('Sold '+sold+' immediately to a wholesaler.',before,'money',[`Sale price ${fmt(v.wholesaleValue)}`,`${state.owned.length} vehicle${state.owned.length===1?'':'s'} remain`]);state.screen='garage';render()}
function makeMarketOffer(kind='classified',bonus=1){normaliseState();let c=state.car;if(!c||!c.listedForSale)return null;let v=estimateCarValue(c);let mode=c.saleMode||'fair';let ask=v.privateValue*listingMultiplier(mode);let interest=mode==='quick'?.55:mode==='fair'?.32:mode==='optimistic'?.18:.08;interest+=Math.min(.18,(state.respect||0)*.004)+Math.min(.18,(c.sceneValue||0)*.025);if(Math.random()>interest*bonus)return null;let buyers=['Bloke from the pits','Local P-plater','Older racer','Facebook Marketplace buyer','Mate of a mate','Workshop regular','Cash buyer'];let ratio=mode==='quick'?rand(.88,1.02):mode==='fair'?rand(.9,1.08):mode==='optimistic'?rand(.82,1.02):rand(.7,.92);let amount=Math.round(Math.max(v.wholesaleValue*1.05,ask*ratio)/50)*50;let id='offer_'+Date.now()+'_'+Math.random().toString(16).slice(2);let message=kind==='pit'?`Saw the car run and wants to buy it while it has some hype.`:`Responded to your ${listingLabel(mode)} listing. Reliability, mods and recent runs affect the offer.`;let offer={id,vehicleId:c.uid,carName:c.name,day:state.day,buyer:choice(buyers),amount,kind,message,closed:false,unread:true};state.marketOffers.push(offer);log('New buyer offer for '+c.name+': '+fmt(amount)+'.','money',[offer.buyer,kind]);notifyMarketOffer(offer,c.name);return offer;}

function tickDynoRun(now){

  if(!Array.isArray(state.notifications))state.notifications=[];

  for(let c of state.owned)calculateBuildEffects(c);

  if(state.lastEvent){

    if(state.lastEvent.lineup===undefined)state.lastEvent.lineup=[];

function canEnterEvent(ev,kind){
  if(hasEventSession())return false;

  if(kind==='race'&&!state.car)return false;
  return state.money>=eventTotalCost(ev,kind);

function crowdAtmosphere(busy){
  if(!busy)return 'People are milling around the pits.';
  if(busy.name==='Quiet night')return 'The place feels quiet, with room in the lanes and a relaxed crowd.';
  if(busy.name==='Normal night')return 'There is a healthy crowd and a steady stream of cars heading to the lanes.';
  if(busy.name==='Busy night')return 'The venue is lively, the pits are full, and plenty of people are watching the lanes.';
  return 'It is packed. The car park is heaving and the staging lanes are stacked deep.';
}

function eventSeed(ev,day=state.day){return hashSeed((ev.id||ev.name)+'|'+day+'|'+(ev.offset||0)+'|'+(ev.travelCost||0));}

function eventNarrative(ev,busy,day=state.day){
  let data=EVENT_STORIES[ev.id]||EVENT_STORIES.heathcote_legal;
  let seed=eventSeed(ev,day);
  let crowd = crowdAtmosphere(busy);
  if(state.respect>=25) crowd += ' People clock you a little more quickly now that you have some respect behind your name.';
  if((busy&&busy.name)==='Packed night') crowd += ' Spectators are stacked deep along the fence.';
  return {
    travel: seededPick(data.travel,seed+1),
    venue: seededPick(data.venue,seed+2),
    turnout: seededPick(data.turnout,seed+3),
    note: seededPick(data.notes,seed+4),

    weather: weatherForEvent(ev,day)

}

function travelToEvent(eventId='heathcote_legal'){

  let field=makeOpponents(busy.cars,ev);
  let raceSlots=pickRaceSlots(field,busy.raceSlots);
  let story=eventNarrative(ev,busy,state.day);

}

function eventProfile(ev=EVENT_CALENDAR[0]){let roll=Math.random();let base=roll<.25?{name:'Quiet night',runs:10,raceSlots:4,cars:18,watch:18}:roll<.6?{name:'Normal night',runs:6,raceSlots:6,cars:34,watch:30}:roll<.87?{name:'Busy night',runs:4,raceSlots:8,cars:56,watch:44}:{name:'Packed night',runs:2,raceSlots:8,cars:74,watch:58};base.cars=Math.round(base.cars*(ev.fieldMult||1));base.watch=Math.round(base.watch*(ev.fieldMult||1));base.raceSlots=Math.min(base.raceSlots+Math.floor((ev.reqRespect||0)/10),14);return base;}

function makeOpponents(n,ev=null){let pool=CARS.filter(c=>c.price<34000);let names=['Mick','Sarah','Davo','Jess','Rob','Tayla','Chris','Ari','Ben','Mia','Noah','Eli','Zoe','Jay','Sam','Alex','Riley','Casey'];return Array.from({length:n},(_,i)=>{let base=choice(pool);let trans=base.manual&&(!base.auto||Math.random()<.55)?'manual':'auto';let o=makeOwned(base,trans);let tier=i/n;let level=rand(.9,1.14)+(state.respect/260)+(tier>.75?rand(.02,.12):0)+(ev?ev.opponentBoost||0:0);o.power*=level;o.grip+=rand(-.035,.09)+(tier>.75?.025:0);if(Math.random()<.18){o.weight-=rand(25,90);o.mods.push('Light interior strip');}o.visible=visibleClues(o);o.label=tier>.88?'quick regular':tier>.7?'serious local':'local car';o.driver=choice(names);o.eventIndex=i;o.entryId=o.id+'_'+i+'_'+Math.random().toString(16).slice(2);return o;});}
function perfIndex(c){let driveBonus=(c.drive==='AWD'||c.drive==='4WD')?1.035:1;let aeroPenalty=1-Math.max(0,(c.aero||.32)-.32)*.12;return (c.power/Math.max(700,c.weight))*(c.grip||.84)*driveBonus*aeroPenalty;}
function pickRaceSlots(field,n){

  let scored=field.map((o,i)=>({i,score:perfIndex(o),gap:Math.abs(perfIndex(o)-playerScore)}));

  for(const item of [...matched,...obviouslySlower]){if(!combined.includes(item.i))combined.push(item.i)}
  return combined.sort((a,b)=>a-b);

function updateAutoLaunchHelp(){

  let style=document.getElementById('launchStyle')?.value||'brake stall';
  let el=document.getElementById('autoLaunchHelp');
  if(!el)return;

  let input=document.getElementById('autoStallRpm');

    input.min=idle;
    input.max=stall;
    input.disabled=style==='normal';
    let raw=Number(input.value)||autoIdealStall(c);

function startLiveRace(i){
  let e=state.lastEvent, opp=e.opponents[i], c=state.car;
  let style=document.getElementById('launchStyle')?.value||(c.trans==='auto'?'brake stall':'slip');

  if(c.trans==='manual') launch=Number(document.getElementById('launchRpm')?.value)||idealLaunch(c);
  else if(style==='brake stall') launch=Math.max(idleRpm(c),Math.min(converterStall(c),Number(document.getElementById('autoStallRpm')?.value)||autoIdealStall(c)));
  else launch=idleRpm(c);
  if(c.trans==='auto') launch=Math.max(idleRpm(c),Math.min(converterStall(c),launch));
  let playerBase=simulate(c,{launch,style,noShift:true},false);
  let rival=simulate(opp,null,true);

function idleRpm(c){return c.asp==='turbo'?900:850}
function converterStall(c){let bonus=c.stallBonus||0;if(c.installed&&c.installed.includes('converter'))bonus=Math.max(bonus,650);return Math.round(Math.min(c.red*.55,(c.stallRpm||2200)+bonus));}
function idealLaunch(c){let base=c.drive==='FWD'?2600:c.drive==='RWD'?3000:3600;if(c.torque>450)base-=400;if(c.asp==='turbo')base+=300;return Math.round(Math.min(c.red*.7,Math.max(1400,base)))}
function autoIdealStall(c){let target=(c.band?c.band[0]:2200)+(c.asp==='turbo'?450:150);return Math.round(Math.min(c.red*.55,Math.max(1700,target)));}

function diffInfo(c){
  if(c.drive==='AWD')return {type:'awd',label:'AWD driveline',bonus:.11};
  if(c.drive==='4WD')return {type:'4wd',label:'4WD driveline',bonus:.10};
  if(c.installed&&c.installed.includes('lsd'))return {type:'clutch-lsd',label:'Aftermarket clutch LSD',bonus:.075};
  const factory={wrx:['viscous centre/AWD',.10],m3:['factory LSD',.06],m5:['factory LSD',.055],c63:['factory LSD',.045],silvia:['viscous LSD',.04],suprana:['torsen LSD',.055],soarer:['torsen LSD',.045],monaro:['factory LSD',.045],commodoresho:['factory LSD',.04],falconxr6t:['factory LSD',.04],'300csrt':['factory LSD',.035]};
  if(factory[c.id])return {type:factory[c.id][0],label:factory[c.id][0],bonus:factory[c.id][1]};
  return {type:'open',label:'Open differential',bonus:0};
}
function tyreInfo(c){
  if(c.mods&&c.mods.includes('Good street tyres'))return {type:'good-street',label:'Good street tyres',bonus:.08};
  if(c.issueNames&&c.issueNames.includes('Worn tyres'))return {type:'worn',label:'Worn street tyres',bonus:-.08};
  return {type:'stock-street',label:'Stock street tyres',bonus:0};
}
function autoLaunchRead(c,rpm){
  let maxStall=converterStall(c), ideal=autoIdealStall(c), diff=diffInfo(c), tyre=tyreInfo(c);
  rpm=Math.max(idleRpm(c),Math.min(maxStall,rpm));

  let idealRatio=Math.max(.55,rpm/Math.max(1600,ideal));
  let driveHit=c.drive==='FWD'?1.02:c.drive==='RWD'?1.0:(c.drive==='AWD'||c.drive==='4WD')?.72:.95;
  let torqueHit=(c.torque/500)*stallRatio*idealRatio*driveHit;
  let gripHold=(c.grip+diff.bonus)*Math.pow(Math.max(1100,c.weight)/1600,.12);
  let score=torqueHit-gripHold;
  let wheelspin=score>.065;
  let nearSweet=Math.abs(rpm-ideal)<360;
  let summary=wheelspin?`The hit looks too aggressive for the current tyres/diff, so expect wheelspin.`:nearSweet?`This looks close to the converter launch sweet spot.`:rpm<ideal?`This is conservative and may leave a little soft, but should be stable.`:`This is aggressive; it may be quick if it hooks.`;
  return {wheelspin,score,gripHold,torqueHit,ideal,diff,tyre,summary};
}
function launchPhysics(c,launchData=null,npc=false){
  let isAuto=c.trans==='auto';
  let style=launchData?launchData.style:(isAuto?(Math.random()<.65?'brake stall':'normal'):(Math.random()<.55?'slip':'dump'));
  let grip=c.grip+(c.launchBonus||0);
  let feedback='', stress=0, launchMod=1, effectiveLaunchRpm=launchData&&launchData.launch?launchData.launch:idealLaunch(c);
  let profile={kind:isAuto?'auto':'manual',style,startRpm:effectiveLaunchRpm,holdRpm:effectiveLaunchRpm,blendTime:1.0,flashRpm:effectiveLaunchRpm};
  if(isAuto){
    let stall=converterStall(c), idle=idleRpm(c), ideal=autoIdealStall(c);
    if(style==='normal'){
      effectiveLaunchRpm=idle;
      profile={kind:'auto',style:'normal',startRpm:idle,holdRpm:idle,flashRpm:stall,converterFloorRpm:stall,blendTime:1.25};
      launchMod+=.075;
      if(c.asp==='turbo')launchMod+=.035;
      feedback+='Normal idle launch. Converter flashed up after the car started moving. ';
    }else{
      let chosen=launchData&&launchData.launch?Math.max(idle,Math.min(stall,launchData.launch)):stall;
      effectiveLaunchRpm=chosen;
      let read=autoLaunchRead(c,chosen);
      profile={kind:'auto',style:'brake stall',startRpm:chosen,holdRpm:chosen,flashRpm:chosen,converterFloorRpm:chosen,blendTime:.65,converterLockedToStall:true,wheelspin:read.wheelspin};
      let delta=Math.abs(chosen-ideal);
      launchMod+=(delta/2600)*.06;
      if(chosen<ideal-450){launchMod+=.055;feedback+='Converter was released below the useful launch range and left soft. ';}
      else if(read.wheelspin){launchMod+=.105+Math.min(.08,Math.max(0,read.score)*.16);stress+=.7;feedback+=`Stalled to ${Math.round(chosen)} rpm and overpowered the available grip. Wheelspin on launch. `;}
      else feedback+=`Stalled to ${Math.round(chosen)} rpm and hooked in the useful range. `;
      if(c.torque>480){stress+=read.wheelspin?.35:.18;feedback+='The auto driveline loaded up against the converter. ';}
      feedback+=`${read.diff.label}; ${read.tyre.label}. `;
    }
  }else{
    let launchRPM=launchData?launchData.launch:idealLaunch(c)+rand(-500,500);
    let ideal=idealLaunch(c), delta=Math.abs(launchRPM-ideal);
    effectiveLaunchRpm=launchRPM;
    profile={kind:'manual',style,startRpm:launchRPM,holdRpm:launchRPM,flashRpm:launchRPM,blendTime:style==='slip'?1.05:.65};
    launchMod+=(delta/3000)*.08;
    if(launchRPM<ideal-700){launchMod+=.08;feedback+='Bogged launch. ';}
    else if(launchRPM>ideal+850&&grip<.94){launchMod+=.1;feedback+='Wheelspin on launch. ';stress+=.8;}
    else feedback+='Clean enough launch. ';
    if(style==='dump'&&c.torque>420&&grip>.9){stress+=1.2;feedback+='Drivetrain shock risk. ';}
    if(style==='slip'){launchMod+=.02;stress+=.4;feedback+='Clutch slip softened the hit. ';}

  return {launchMod,feedback,stress,grip,effectiveLaunchRpm,profile};
}
function simulate(c,launchData=null,npc=false){let hp=c.power,kg=c.weight,lb=kg*2.20462;let base=5.825*Math.pow(lb/hp,1/3);let lp=launchPhysics(c,launchData,npc);let grip=lp.grip;let launchMod=lp.launchMod;let feedback=lp.feedback;let stress=lp.stress;
let shiftMod=1;let shiftNote='';let bestShift=Math.min(c.red-150,c.peak+350);if(launchData&&launchData.noShift){shiftNote='';}
else if(c.trans==='auto'&&c.shiftMode==='D'){let autoShift=c.red-100;if(autoShift>bestShift+350){shiftMod+=.035;shiftNote='Auto held gear past best acceleration. ';}}
else if(!npc){let skill=rand(-.025,.025);shiftMod+=skill;shiftNote=skill>0.015?'A couple of shifts were a little off. ':'Shifts were tidy. ';}
else shiftMod+=rand(-.02,.025);
let aeroMod=1+Math.max(0,c.aero-.32)*.16;let gripMod=grip<.85?1.06:grip>.93?.96:1;let relMod=c.reliability<70?1.03:1;let et=(base*launchMod*shiftMod*aeroMod*gripMod*relMod)+rand(-.08,.12);let trap=377*Math.pow(hp/lb,1/3)*(1-(c.aero-.3)*.08)+rand(-3,3);let sixty=1.65+(et-10)*.12+(launchMod-1)*2.2;let eighth=et*.64+rand(-.05,.05);let gs=gSpark(et,launchMod,shiftMod,grip);return {et,trap,sixty,eighth,gs,accel:gs.vals[gs.vals.length-1],feedback:feedback+shiftNote,stress,launchMod,shiftMod,grip,launchProfile:lp.profile,effectiveLaunchRpm:lp.effectiveLaunchRpm};}
function gSpark(et,launchMod,shiftMod,grip){let vals=[];let start=Math.max(.18,1.05/launchMod*(grip>.92?1.05:.9));for(let i=0;i<12;i++){let decay=i*.045;let v=start-decay+Math.sin(i/2)*.025-(shiftMod-1)*.5;if(i>8)v-=.07;vals.push(Math.max(.12,Math.min(1.15,v)));}let chars='▁▂▃▄▅▆▇█';let spark=vals.map(v=>chars[Math.max(0,Math.min(7,Math.floor(v/1.15*8)))]).join('');return {spark,vals};}
function shiftTarget(c){return Math.min(c.red-(c.shiftBuffer||250),c.peak+350)}
function gearMaxes(c){return (c.trans==='auto'?(c.autoMax||c.manualMax):(c.manualMax||c.autoMax))||[55,95,140,190,245,300].slice(0,c.gears||5)}
function maxSpeedInGear(c,gear){let arr=gearMaxes(c);return arr[Math.max(0,Math.min(arr.length-1,gear-1))]||arr[arr.length-1]||220}
function rpmFromSpeed(c,gear,speed,elapsed=9,profile=null){
  let max=maxSpeedInGear(c,gear);
  let roadRpm=(speed/max)*c.red;
  let rpm=roadRpm;
  if(profile&&profile.kind==='auto'){
    if(profile.style==='brake stall'&&profile.converterLockedToStall){
      // A brake-stalled auto cannot be loaded beyond converter stall before launch,
      // and once released the engine should not instantly fall below that selected stall speed.
      // Hold the converter floor until vehicle speed/gear load naturally pulls road rpm above it.
      rpm=Math.max(roadRpm,profile.converterFloorRpm||profile.holdRpm||idleRpm(c));

      // Normal launch starts near idle, then the converter flashes toward stall.

    }

  }
  return Math.max(idleRpm(c),Math.min(c.red+250,rpm));

function currentRpmForRun(c,gear,elapsed,totalEt,trap,profile=null){let p=progressForRun(elapsed,totalEt);return rpmFromSpeed(c,gear,speedForRun(trap,p),elapsed,profile)}
function progressForRun(elapsed,totalEt){return Math.max(0,Math.min(1,elapsed/totalEt))}

async function callQmbApi(payload,options={}){let res=await fetch(QMB_API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':QMB_PUBLISHABLE_KEY},body:JSON.stringify(payload),keepalive:Boolean(options.keepalive)});let data=await res.json();if(!res.ok)throw new Error(data.error||'Multiplayer request failed.');return data}
function publicStatsSnapshot(){let car=state.car;if(car)calculateBuildEffects(car);return {day:state.day,money:state.money,respect:state.respect,car:car?{name:car.name,power:car.power,weight:car.weight,reliability:car.reliability,drive:car.drive,trans:car.trans,bestET:car.bestET,wins:car.wins||0,mods:Array.isArray(car.mods)?car.mods.slice(-12):[],modSpend:car.modSpend||0}:null}}
async function syncPublicStats(force=false,keepalive=false){let recoveryCode=localStorage.getItem(QMB_RECOVERY_STORAGE);if(!recoveryCode||!socialData)return false;let stats=publicStatsSnapshot(),signature=JSON.stringify(stats),now=Date.now();if(!force&&signature===lastStatsSignature&&now-lastStatsSyncAt<300000)return false;try{await callQmbApi({action:'syncStats',recoveryCode,stats},{keepalive});lastStatsSignature=signature;lastStatsSyncAt=now;return true}catch{return false}}

async function createAnonymousGarage(){if(localStorage.getItem(QMB_RECOVERY_STORAGE)&&!confirm('This device already has a recovery code. Create a different garage?'))return;socialBusy=true;renderSocialPanel();try{let inviteCode=new URLSearchParams(location.search).get('invite')||'';let data=await callQmbApi({action:'createAccount',inviteCode});localStorage.setItem(QMB_RECOVERY_STORAGE,data.recoveryCode);socialData=data.social;socialError='';history.replaceState({},'',location.pathname);try{await navigator.clipboard.writeText(data.recoveryCode)}catch{}prompt('Your garage is ready. Copy this recovery code now and keep it private:',data.recoveryCode);await cloudSave(false);render()}catch(err){socialError=err&&err.message?err.message:'Could not create a garage.'}finally{socialBusy=false;renderSocialPanel();if(state.screen==='social')document.getElementById('screen').innerHTML=social()}}
async function recoverGarage(){let code=prompt('Paste your Quarter Mile Builder recovery code:');if(!code)return;code=code.trim().toUpperCase();try{let data=await callQmbApi({action:'login',recoveryCode:code});localStorage.setItem(QMB_RECOVERY_STORAGE,code);socialData=data;socialError='';let invite=new URLSearchParams(location.search).get('invite');if(invite)await socialRequest({action:'acceptInvite',code:invite});history.replaceState({},'',location.pathname);render()}catch(err){alert(err&&err.message?err.message:'That recovery code could not be used.')}}
async function cloudSave(notify=false){if(socialData&&socialData.save&&socialData.save.state)state=migrateGameState(mergeBadgeCareer(state,socialData.save.state));let pending=state.badgeHistory&&state.badgeHistory.pendingRemoteSync,recoveryCode=localStorage.getItem(QMB_RECOVERY_STORAGE);if(!recoveryCode){localStorage.setItem('qmb_mvp_save',JSON.stringify(state));if(notify)alert('Local backup saved. Create an anonymous garage to sync online.');return}if(pending){try{let latest=await callQmbApi({action:'getSocial',recoveryCode});if(latest&&latest.save&&latest.save.state)state=migrateGameState(mergeBadgeCareer(state,latest.save.state));if(latest)socialData={...socialData,...latest}}catch{localStorage.setItem('qmb_mvp_save',JSON.stringify(state));if(notify)alert('Local backup saved. Badge sync will retry when the paddock connection returns.');return false}}if(state.badgeHistory)state.badgeHistory.pendingRemoteSync=false;localStorage.setItem('qmb_mvp_save',JSON.stringify(state));let data=await socialRequest({action:'save',state});if(!data&&state.badgeHistory){state.badgeHistory.pendingRemoteSync=pending;localStorage.setItem('qmb_mvp_save',JSON.stringify(state))}if(notify)alert(data?'Career synced to the cloud.':socialError);return !!data}
async function cloudLoad(){if(!socialData||!socialData.save||!socialData.save.state)return alert('No cloud career found.');if(!confirm('Load your cloud career and replace the current local session?'))return;state=migrateGameState(mergeBadgeCareer(clone(socialData.save.state),state));localStorage.setItem('qmb_mvp_save',JSON.stringify(state));log('Cloud career loaded.','event',['Online sync']);render()}

async function renameDriver(){let current=socialData&&socialData.profile?socialData.profile.displayName:'Driver';let displayName=prompt('Choose a public driver name (2-30 characters):',current);if(displayName===null)return;let data=await socialRequest({action:'profile',displayName});if(data)render()}
async function copyRecoveryCode(){let code=localStorage.getItem(QMB_RECOVERY_STORAGE)||'';if(!code)return;try{await navigator.clipboard.writeText(code);alert('Recovery code copied. Keep it private.')}catch{prompt('Copy this recovery code and keep it private:',code)}}
function toggleRecoveryCode(){recoveryCodeRevealed=!recoveryCodeRevealed;if(state.screen==='social')document.getElementById('screen').innerHTML=social()}
function inviteUrl(code){return location.origin+location.pathname+'?invite='+encodeURIComponent(code)}
async function copyInviteLink(){let code=socialData&&socialData.invite?socialData.invite.code:'';if(!code)return;let url=inviteUrl(code);try{await navigator.clipboard.writeText(url);alert('Invite link copied. Send it to a friend.')}catch{prompt('Copy this invitation link:',url)}}
async function shareInviteLink(){let code=socialData&&socialData.invite?socialData.invite.code:'';if(!code)return;let url=inviteUrl(code);if(navigator.share){try{await navigator.share({title:'Quarter Mile Builder invite',text:'Join my garage and compare your quarter-mile progress.',url});return}catch(err){if(err&&err.name==='AbortError')return}}await copyInviteLink()}
function forgetGarage(){if(!confirm('Forget this garage on this device? Make sure you copied the recovery code first.'))return;localStorage.removeItem(QMB_RECOVERY_STORAGE);socialData=null;socialError='';recoveryCodeRevealed=false;render()}
async function queueSocialRace(player,won){if(!socialData||!state.car)return;await socialRequest({action:'recordRace',race:{carName:state.car.name,et:player.et,trap:player.trap,power:state.car.power,won}});await cloudSave(false)}

function ensureSpecialEventState(){if(!state.specialEventPrestige||typeof state.specialEventPrestige!=='object')state.specialEventPrestige={};if(!state.specialEventPrestige.youYangs)state.specialEventPrestige.youYangs=freshYouYangs();let y=state.specialEventPrestige.youYangs,d=freshYouYangs();for(let k of Object.keys(d))if(y[k]===undefined)y[k]=clone(d[k]);if(!y.attempts)y.attempts=clone(d.attempts);for(let k of Object.keys(d.attempts))if(!Number.isFinite(y.attempts[k]))y.attempts[k]=d.attempts[k];if(!y.best)y.best=clone(d.best);if(!y.best.acceleration)y.best.acceleration=clone(d.best.acceleration);if(!y.tiers)y.tiers=clone(d.tiers);if(!y.carRecords||typeof y.carRecords!=='object')y.carRecords={};return y}

function yyPayEntry(){let y=youYangsState(),c=yySelectedCar();if(!yyCanEnter())return alert(`The proving ground is unavailable until Day ${y.nextEligibleDay}.`);if(!c)return alert('Select an available owned car first.');let fee=yyEntryFee(c);if(state.money<fee)return alert('You do not have enough money for this entry.');let before=snapshot();state.money-=fee;y.entered=true;y.entryPaid=fee;y.sessionStartDay=state.day;y.nextEligibleDay=state.day+SPECIAL_EVENTS.youYangs.cooldownDays;y.visits=(Number(y.visits)||0)+1;y.attempts=yyFreshAttempts();if(y.overallTitle==='Not entered')y.overallTitle=SPECIAL_EVENTS.youYangs.overallTitles.entrant;logChange(`Entered ${SPECIAL_EVENTS.youYangs.name} with ${c.name}.`,before,'money',[`Entry fee ${fmt(fee)}`,yyIsFord(c)?'Ford proving-ground discount applied':'Standard vehicle entry','Two attempts in each challenge',`Next entry available Day ${y.nextEligibleDay}`]);localStorage.setItem('qmb_mvp_save',JSON.stringify(state));state.screen='youYangs';render()}
function yyConcludeSession(ask=true){let y=youYangsState();if(!y.entered)return;if(ask&&!confirm('Conclude this You Yangs session? Any unused attempts will be lost. Lifetime records and prestige will remain.'))return;let car=yySelectedCar(),unused=Object.values(y.attempts).reduce((a,b)=>a+Math.max(0,b),0);y.entered=false;y.entryCarId=null;y.entryPaid=0;y.sessionStartDay=null;y.completionAcknowledged=true;localStorage.setItem('qmb_mvp_save',JSON.stringify(state));log(`You Yangs session concluded${car?' for '+car.name:''}.`,'event',[unused?`${unused} unused attempt${unused===1?'':'s'} forfeited`:'All scheduled attempts completed',`Next entry available Day ${y.nextEligibleDay}`]);state.screen='youYangs';render()}
function yyTier(challenge,value){if(value===null||value===undefined)return'unranked';let rows=YY_TIERS[challenge]||[];for(let r of rows)if((r.max!==undefined&&value<=r.max)||(r.min!==undefined&&value>=r.min))return r.tier;return'entrant'}
function yyUpdateTitle(){let y=youYangsState(),cfg=SPECIAL_EVENTS.youYangs.overallTitles,ts=Object.values(y.tiers),completed=ts.filter(x=>x&&x!=='unranked').length,gold=ts.filter(x=>x==='gold').length,silverOrBetter=ts.filter(x=>x==='silver'||x==='gold').length,allBronzeOrBetter=completed===3&&ts.every(x=>x==='bronze'||x==='silver'||x==='gold');if(!y.entered&&!y.visits)y.overallTitle='Not entered';else if(completed===3&&gold>=2&&silverOrBetter===3)y.overallTitle=cfg.elite;else if(allBronzeOrBetter&&silverOrBetter>=2)y.overallTitle=cfg.specialist;else if(completed>=2)y.overallTitle=cfg.contender;else y.overallTitle=cfg.entrant;if(y.lastResult){let c=yySelectedCar();checkRelevantBadges('you_yangs_speed',badgeCarContext(c,{peakSpeed:y.lastResult.peakSpeed,detail:`You Yangs peak ${Math.round(y.lastResult.peakSpeed)} km/h`}))}}
function yyBestLine(k){let y=youYangsState(),b=y.best[k];if(k==='standingKilometre')return b?`${b.time.toFixed(2)} s @ ${b.terminalSpeed.toFixed(0)} km/h`:'No result';if(k==='highSpeed')return b?`${b.peakSpeed.toFixed(0)} km/h peak`:'No result';let a=b||{};return `0–100: ${a.zeroTo100?Number(a.zeroTo100).toFixed(2)+' s':'—'} · 0–160: ${a.zeroTo160?Number(a.zeroTo160).toFixed(2)+' s':'—'} · 0–200: ${a.zeroTo200?Number(a.zeroTo200).toFixed(2)+' s':'Not reached'}`}

function yyRecordCarResult(car,result){if(!car||!result)return;let y=youYangsState(),id=car.uid||car.id;if(!id)return;let rec=y.carRecords[id]||{vehicleId:id,carId:car.id,name:car.name,firstTestDay:state.day,lastTestDay:state.day,sessionKeys:[],runs:0,best:{standingKilometre:null,highSpeed:null,acceleration:null}};rec.name=car.name;rec.carId=car.id;rec.lastTestDay=state.day;rec.runs=(Number(rec.runs)||0)+1;rec.sessionKeys=Array.isArray(rec.sessionKeys)?rec.sessionKeys:[];let sessionKey=`${y.visits||1}:${y.sessionStartDay||state.day}`;if(!rec.sessionKeys.includes(sessionKey))rec.sessionKeys.push(sessionKey);rec.snapshot={power:Math.round(car.power),weight:Math.round(car.weight),drive:car.drive,trans:car.trans,shiftMode:car.shiftMode||'',day:state.day};if(result.challenge==='standingKilometre'){let next={time:result.elapsed,terminalSpeed:result.finishSpeed,day:state.day,power:rec.snapshot.power,weight:rec.snapshot.weight};if(!rec.best.standingKilometre||next.time<rec.best.standingKilometre.time)rec.best.standingKilometre=next}else if(result.challenge==='highSpeed'){let next={peakSpeed:result.peakSpeed,finishSpeed:result.finishSpeed,speed1000:result.distanceSpeeds[1000]?.speed||null,speed2000:result.distanceSpeeds[2000]?.speed||null,speed3000:result.distanceSpeeds[3000]?.speed||result.finishSpeed,day:state.day,power:rec.snapshot.power,weight:rec.snapshot.weight};if(!rec.best.highSpeed||next.peakSpeed>rec.best.highSpeed.peakSpeed)rec.best.highSpeed=next}else{let next={zeroTo100:result.milestones[100]?.time||null,zeroTo160:result.milestones[160]?.time||null,zeroTo200:result.milestones[200]?.time||null,peakSpeed:result.peakSpeed,peakG:result.peakG,day:state.day,power:rec.snapshot.power,weight:rec.snapshot.weight};if(yyAccelerationScore(next)<yyAccelerationScore(rec.best.acceleration))rec.best.acceleration=next}y.carRecords[id]=rec}

function yyResultHtml(r){if(r.challenge==='standingKilometre')return `<p>1000 m: <b>${r.elapsed.toFixed(2)} s</b> @ ${r.finishSpeed.toFixed(0)} km/h</p><p>0–100: ${yyVal(r.milestones[100]?.time)} · 0–160: ${yyVal(r.milestones[160]?.time)} · 402 m: ${yyVal(r.distanceSpeeds[402]?.time)}</p>`;if(r.challenge==='highSpeed')return `<p>Peak speed: <b>${r.peakSpeed.toFixed(0)} km/h</b> · Finish: ${r.finishSpeed.toFixed(0)} km/h</p><p>1000 m: ${r.distanceSpeeds[1000]?.speed?.toFixed(0)||'—'} km/h · 2000 m: ${r.distanceSpeeds[2000]?.speed?.toFixed(0)||'—'} km/h · 3000 m: ${r.distanceSpeeds[3000]?.speed?.toFixed(0)||'—'} km/h</p>`;return `<p>0–100: <b>${yyVal(r.milestones[100]?.time)}</b> · 0–160: <b>${yyVal(r.milestones[160]?.time)}</b> · 0–200: <b>${yyVal(r.milestones[200]?.time)}</b></p><p>Peak acceleration: ${r.peakG.toFixed(2)} g · Peak speed: ${r.peakSpeed.toFixed(0)} km/h · Distance: ${r.distance.toFixed(0)} m</p>`}

function season(){normaliseAccounting();let seasons=[...new Set(state.accounting.map(x=>x.season))].sort((a,b)=>a-b);let currentSeason=seasonForDay(state.day);if(!seasons.includes(currentSeason))seasons.push(currentSeason);let selected=state.accountingSeason||'all';let opts=['all',...seasons].map(s=>`<option value="${s}" ${String(selected)===String(s)?'selected':''}>${s==='all'?'All seasons':'Season '+s}</option>`).join('');let entries=state.accounting.filter(x=>selected==='all'||String(x.season)===String(selected));let summaries=(state.eventSummaries||[]).filter(x=>selected==='all'||String(x.season)===String(selected));let cashIn=sumAccounting(entries,'cashDelta',x=>x.cashDelta>0),cashOut=sumAccounting(entries,'cashDelta',x=>x.cashDelta<0),cashNet=sumAccounting(entries,'cashDelta'),respectIn=sumAccounting(entries,'respectDelta',x=>x.respectDelta>0),respectOut=sumAccounting(entries,'respectDelta',x=>x.respectDelta<0),respectNet=sumAccounting(entries,'respectDelta');let eventRows=summaries.length?summaries.slice().reverse().map(x=>`<tr><td>Day ${x.day}</td><td>${x.eventName}</td><td>${x.winCount}-${x.lossCount}</td><td class="${x.cashNet>=0?'goodText':'badText'}">${signedMoney(x.cashNet)}</td><td class="${x.respectNet>=0?'goodText':'badText'}">${signedNumber(x.respectNet,1)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No completed events recorded for this selection.</td></tr>';return `<section class="card"><div class="row"><div><h2>Season Balance Sheet</h2><p class="muted">Track earnings, costs, Respect gains and profitability by season. A season is currently 14 in-game days.</p></div><select class="select" onchange="state.accountingSeason=this.value;render()">${opts}</select></div><div class="raceHud"><div class="gauge"><div class="muted">Cash income</div><div class="value goodText">${fmt(cashIn)}</div></div><div class="gauge"><div class="muted">Cash costs</div><div class="value badText">${fmt(Math.abs(cashOut))}</div></div><div class="gauge"><div class="muted">Cash net</div><div class="value ${cashNet>=0?'goodText':'badText'}">${signedMoney(cashNet)}</div></div><div class="gauge"><div class="muted">Respect net</div><div class="value ${respectNet>=0?'goodText':'badText'}">${signedNumber(respectNet,1)}</div></div></div><div class="hr"></div><h3>Completed event statements</h3><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Day</th><th align="left">Event</th><th align="left">W-L</th><th align="left">Cash P/L</th><th align="left">Respect</th></tr></thead><tbody>${eventRows}</tbody></table><div class="hr"></div><h3>Cash and Respect ledger</h3><div class="log" style="max-height:420px"><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Day</th><th align="left">Type</th><th align="left">Item</th><th align="left">Cash</th><th align="left">Respect</th></tr></thead><tbody>${balanceTableRows(entries.slice().reverse())}</tbody></table></div></section>`}
function logScreen(){return `<section class="card"><h2>Log</h2><p class="muted">Every money, Respect, event and penalty change is shown here to make testing easier.</p><div class="log">${state.log.length?state.log.map(renderLogEntry).join(''):'<div class="muted">No log entries yet.</div>'}</div></section>`}
function saveGame(){localStorage.setItem('qmb_mvp_save',JSON.stringify(state));log('Local backup saved.');cloudSave(true);}
function loadGame(manual=false){if(manual&&socialData&&socialData.save)return cloudLoad();let s=localStorage.getItem('qmb_mvp_save');if(s){state=migrateGameState(mergeBadgeCareer(JSON.parse(s),state));if(manual)log('Local backup loaded.')}else if(manual)alert('No local or cloud save found.');render();}
function resetGame(){if(confirm('Reset the game?')){localStorage.removeItem('qmb_mvp_save');state=freshState();refreshListings();render();}}
document.addEventListener('click',e=>{let button=e.target.closest&&e.target.closest('button');if(button&&!button.disabled&&button.id!=='soundToggle')playSfx('click')});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDriverProfile();if(e.code==='Space'&&!document.getElementById('driverProfileOverlay')){e.preventDefault();if(yyRun)handleYouYangsInput();else handleLiveShift();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')syncPublicStats(false,true)});
refreshListings();loadGame(false);render();initSocial();refreshPresence();setInterval(refreshPresence,60000);setInterval(()=>syncPublicStats(false),60000);setInterval(()=>{if(state.screen==='social')refreshCompetitiveData()},30000);
</script>
